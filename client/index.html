<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ?v=2 makes browsers fetch the icon again instead of showing one they cached earlier. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#000000" />
    <title>M&M Clothing — Management System</title>
  </head>
  <body>
    <div id="root">
      <!-- Shown from the first paint until the app takes over (React replaces everything inside #root): the same mark as
           components/Loader.tsx, so a reload isn't a blank white page while the scripts arrive. -->
      <style>
        #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #f9fafb; }
        #boot .ring { position: relative; width: 52px; height: 52px; }
        #boot svg { position: absolute; inset: 0; animation: boot-spin 1.1s linear infinite; }
        #boot .disc { position: absolute; inset: 8px; border-radius: 50%; background: #000; display: flex; align-items: center; justify-content: center; }
        @keyframes boot-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { #boot svg { animation: none; } }
      </style>
      <div id="boot" role="status" aria-label="Loading">
        <div class="ring">
          <svg viewBox="0 0 44 44" fill="none" aria-hidden="true">
            <circle cx="22" cy="22" r="20" stroke="#e5e7eb" stroke-width="3" />
            <path d="M22 2a20 20 0 0 1 20 20" stroke="#000" stroke-width="3" stroke-linecap="round" />
          </svg>
          <div class="disc">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="position: static; animation: none;" aria-hidden="true">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
              <path d="M3 6h18" />
              <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
